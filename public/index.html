<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Oaxaca de Juárez</title>
    
    <!-- Hoja de estilos de Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    
    <style>
        /* Estilos básicos para que el mapa ocupe toda la ventana */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
        }
        
        #mapa {
            width: 100vw;
            height: 100vh; /* Ocupa el 100% del alto de la pantalla */
        }
    </style>
</head>
<body>

    <!-- Contenedor del mapa -->
    <div id="mapa"></div>

    <!-- Script de Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- Script de Leaflet Omnivore -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-omnivore/0.3.1/leaflet-omnivore.min.js"></script>
    
    <!-- Script Cliente de Socket.IO (Proporcionado automáticamente por el servidor) -->
    <script src="/socket.io/socket.io.js"></script>

    <script>
        // 1. Definir los límites del mapa para restringir la vista a Oaxaca
        const limitesOaxaca = [
            [16.85, -96.95], // Suroeste
            [17.25, -96.55]  // Noreste
        ];

        // Inicializar el mapa con límites de paneo y zoom mínimo
        const mapa = L.map('mapa', {
            maxBounds: limitesOaxaca,
            maxBoundsViscosity: 1.0, // Hace el límite rígido para no salir de Oaxaca
            minZoom: 11 // Evita que el usuario quite zoom y vea todo México
        }).setView([17.0608, -96.7250], 12);

        // 2. Configurar el Tile Layer de CartoDB Light
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(mapa);

        // 3. Lista de archivos KML vinculando el nombre real del archivo con un nombre limpio para mostrar
        const kmlFiles = [
            { archivo: "Ruta RC-11 Má┼² La RayaAeropuerto - Módulo Azul.kml", nombre: "RC-11 Má' La Raya Aeropuerto - Módulo Azul" },
            { archivo: "Ruta RC-15 Yu Ngnta' H de la Mujer y la Niñez Oaxaqueña - Base Walmart Símbolos Patrios - Módulo Azul.kml", nombre: "RC-15 Yu Ngnta' H de la Mujer y la Niñez - Módulo Azul" },
            { archivo: "Ruta RC-06 Mondok San Jacinto Amilpas - Camino a Huayápam.kml", nombre: "RC-06 Mondok San Jacinto Amilpas - Camino a Huayápam" },
            { archivo: "Ruta RC-10 Kaymo Manzana L - Ánimas Trujano.kml", nombre: "RC-10 Kaymo Manzana L - Ánimas Trujano" },
            { archivo: "Ruta RC-09 Kítsian Jan Colónia Bugambilias - Fracc. El Rosario.kml", nombre: "RC-09 Kítsian Jan Colonia Bugambilias - Fracc. El Rosario" },
            { archivo: "Ruta RA-18 Nave'e Yuroo Viguera – Centro de Rehabilitación DIF.kml", nombre: "RA-18 Nave'e Yuroo Viguera – Centro de Rehabilitación DIF" },
            { archivo: "Ruta RA-04 Monumento a la MadreTecnológico - Santa Cruz Amilpas.kml", nombre: "RA-04 Monumento a la Madre Tecnológico - Santa Cruz Amilpas" },
            { archivo: "Ruta RA-02 Mo' Santa María Atzompa - Guadalupe Victoria.kml", nombre: "RA-02 Mo' Santa María Atzompa - Guadalupe Victoria" },
            { archivo: "Ruta RA-05 GUIE' Colonia Jardín - Anáhuac.kml", nombre: "RA-05 GUIE' Colonia Jardín - Anáhuac" },
            { archivo: "Ruta RA-10 Tza' Tøk Fraccionamiento el Rosario 5a. Etapa - La Cuevita.kml", nombre: "RA-10 Tza' Tøk Fracc. El Rosario 5a. Etapa - La Cuevita" },
            { archivo: "Ruta RA-14 Poj Montoya - Fraccionamiento El Rosario.kml", nombre: "RA-14 Poj Montoya - Fracc. El Rosario" },
            { archivo: "Ruta RT-01 Kayaal Yuroo Viguera - Yuroo Xoxocotlán (2).kml", nombre: "RT-01 Kayaal Yuroo Viguera - Yuroo Xoxocotlán" },
            { archivo: "Ruta RA-07 Uxacha 2da. Sección Guadalupe Victoria - Colonia Moctezuma.kml", nombre: "RA-07 Uxacha 2da. Sección Guadalupe Victoria - Col. Moctezuma" },
            { archivo: "Ruta RC-08 Ruja Colonia Jardín - Colonia Heladio Ramírez López.kml", nombre: "RC-08 Ruja Colonia Jardín - Col. Heladio Ramírez López" },
            { archivo: "Ruta RC-04 Atlantekomatl Fracc. Benito JuárezEsmeralda - Plaza del Valle.kml", nombre: "RC-04 Atlantekomatl Fracc. Benito Juárez Esmeralda - Plaza del Valle" },
            { archivo: "Ruta RA-09 Moog Fraccionamiento Los Álamos - Panteón Jardín.kml", nombre: "RA-09 Moog Fracc. Los Álamos - Panteón Jardín" },
            { archivo: "Ruta RC-02 Fane Kantsini Viguera - Primera Etapa.kml", nombre: "RC-02 Fane Kantsini Viguera - Primera Etapa" },
            { archivo: "Ruta RC-01 Fane Kantsini Viguera - Segunda Etapa.kml", nombre: "RC-01 Fane Kantsini Viguera - Segunda Etapa" },
            { archivo: "Ruta RC-03 Fane Kantsini Viguera - Tercera Etapa.kml", nombre: "RC-03 Fane Kantsini Viguera - Tercera Etapa" },
            { archivo: "Ruta RC-05 Atlantekomatl Fracc. Benito JuárezEsmeralda - Plaza del Valle.kml", nombre: "RC-05 Atlantekomatl Fracc. Benito Juárez Esmeralda - Plaza del Valle" },
            { archivo: "Ruta RC-07 Ruja Colonia Jardín - Colonia Heladio Ramírez López.kml", nombre: "RC-07 Ruja Colonia Jardín - Col. Heladio Ramírez López" },
            { archivo: "Ruta RC-12 Kaymo Manzana L - Ánimas Trujano.kml", nombre: "RC-12 Kaymo Manzana L - Ánimas Trujano" },
            { archivo: "Ruta RC-13 Mondok San Jacinto Amilpas - Camino a Huayápam.kml", nombre: "RC-13 Mondok San Jacinto Amilpas - Camino a Huayápam" },
            { archivo: "Ruta RC-14 Kaymo Manzana L - Ánimas Trujano.kml", nombre: "RC-14 Kaymo Manzana L - Ánimas Trujano" },
            { archivo: "Ruta RC-15 Yu Ngnta' H de la Mujer y la Niñez Oaxaqueña - Base Walmart Símbolos Patrios - Módulo Azul.kml", nombre: "RC-15 Yu Ngnta' H de la Mujer y la Niñez - Módulo Azul" }
        ];

        const capasRutas = []; // Para almacenar las capas de KML y poder buscar las estaciones luego

        // 4. Cargar y renderizar cada archivo KML
        kmlFiles.forEach((ruta, index) => {
            // Distribuir el color equitativamente a lo largo del espectro (0-360) 
            // para asegurar que cada ruta tenga un color diferente y bien distinguible
            const hue = index * (360 / kmlFiles.length);
            const colorRuta = `hsl(${hue}, 80%, 45%)`;

            // Crear la capa base para inyectarle estilos
            const customLayer = L.geoJson(null, {
                style: function() {
                    // Color gris inicial para todas las rutas
                    return { color: '#888888', weight: 1.5, opacity: 0.7 }; // Grosor permanentemente fino
                },
                // pointToLayer dibuja los puntos (paradas) como círculos en lugar del marcador azul por defecto
                pointToLayer: function(feature, latlng) {
                    return L.circleMarker(latlng, {
                        radius: 3,           // Tamaño pequeño y fijo para el punto
                        fillColor: '#888888', // Color gris inicial
                        color: '#fff',       // Borde blanco para que resalten
                        weight: 1,           // Borde del punto más fino
                        opacity: 1,
                        fillOpacity: 0.9     // Opacidad del relleno
                    });
                }
            });

            // Guardamos el color único de la ruta en la capa para poder iluminarla en el futuro
            customLayer.colorRuta = colorRuta;

            capasRutas.push(customLayer);

            // Cargar el KML con omnivore, inyectando la capa estilizada
            omnivore.kml(`kml/${ruta.archivo}`, null, customLayer)
                .on('ready', function() {
                    // Evitar que las medidas originales del archivo KML sobreescriban nuestro estilo fino
                    this.setStyle({ color: '#888888', weight: 1.5, opacity: 0.7 });

                    // Iterar las capas de este KML para añadir un popup interactivo
                    this.eachLayer(function(layer) {
                        // También forzar un tamaño fino en las paradas
                        if (layer.setRadius) {
                            layer.setRadius(3);
                            layer.setStyle({ fillColor: '#888888', color: '#fff', weight: 1, fillOpacity: 0.9 });
                        }
                        layer.bindPopup(`<b>Ruta:</b><br>${ruta.nombre}`);

                        // [NUEVO] Reproducir sonido al hacer clic manual en la ruta/parada para probar
                        layer.on('click', function() {
                            reproducirMarimba();
                        });
                    });
                })
                .addTo(mapa);
        });

        // 5. Configuración de Web Audio API (Marimba)
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        // Los navegadores bloquean el audio automático. Un solo clic en el mapa inicializará el motor de audio.
        document.addEventListener('click', () => {
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }, { once: true });

        function reproducirMarimba() {
            // Intentar reanudar el contexto si sigue suspendido
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            const tiempo = audioCtx.currentTime + 0.05; // Un ligero retraso evita chasquidos

            // Configuración del sonido: Seno para el cuerpo del sonido y Triángulo para el golpe
            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(523.25, tiempo); // C5
            osc2.type = 'triangle';
            osc2.frequency.setValueAtTime(1046.50, tiempo); // C6 (Una octava arriba)

            // Envolvente de volumen (Decaimiento rápido percusivo)
            gainNode.gain.setValueAtTime(1, tiempo);
            gainNode.gain.exponentialRampToValueAtTime(0.001, tiempo + 0.5);

            osc1.connect(gainNode);
            osc2.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc1.start(tiempo);
            osc2.start(tiempo);
            osc1.stop(tiempo + 0.5);
            osc2.stop(tiempo + 0.5);
            
            console.log("🎵 Sonido reproducido");
        }

        // 6. Conexión de Socket.IO
        const socket = io();

        const layerTimers = {}; // Guarda los temporizadores activos de cada capa

        socket.on('iluminar_estacion', function(nombreEstacion) {
            let fueIluminada = false;
            
            // 1. Limpiamos el nombre buscado: minúsculas, sin espacios extra y sin puntos
            const nombreBuscado = nombreEstacion.trim().toLowerCase().replace(/\./g, '');
            
            // Función recursiva para verificar e iluminar una capa o marcador individual
            const verificarCapa = (layer) => {
                if (layer.feature && layer.feature.properties) {
                    // Soportamos la propiedad 'nombre' (tu GeoJSON) o 'name' (los KML originales)
                    const propNombre = layer.feature.properties.nombre || layer.feature.properties.name;
                    if (propNombre) {
                        const nombreActual = propNombre.trim().toLowerCase().replace(/\./g, '');
                        if (nombreActual === nombreBuscado) {
                            if (layer.setStyle) {
                                layer.setStyle({ fillColor: '#ff9900', color: '#ff9900', radius: 7, fillOpacity: 1, weight: 2 });
                                layer.bringToFront();
                                fueIluminada = true;
                                
                                // Opcional: Centrar el mapa en la estación con animación de "vuelo"
                                if (layer.getLatLng) {
                                    mapa.flyTo(layer.getLatLng(), 15, { duration: 1.5 });
                                }

                                // Si hay un temporizador previo para esta capa, lo limpiamos
                                const layerId = L.stamp(layer); // Genera/obtiene un ID único interno de Leaflet
                                if (layerTimers[layerId]) {
                                    clearTimeout(layerTimers[layerId]);
                                }

                                // Regresar al estilo gris original después de 10 segundos (10000 ms)
                                layerTimers[layerId] = setTimeout(() => {
                                    if (layer.setStyle) {
                                        layer.setStyle({ 
                                            radius: 3,           
                                            fillColor: '#888888', 
                                            color: '#fff',       
                                            weight: 1,           
                                            fillOpacity: 0.9     
                                        });
                                    }
                                    delete layerTimers[layerId];
                                }, 10000);
                            }
                        }
                    }
                }
            };

            // 2. Buscar en todas las capas del mapa (incluyendo grupos inyectados como L.geoJson)
            mapa.eachLayer(layer => {
                if (layer.eachLayer) {
                    // Si es un grupo (como tu GeoJSON), iteramos sus subcapas
                    layer.eachLayer(subLayer => verificarCapa(subLayer));
                } else {
                    // Si es una capa individual
                    verificarCapa(layer);
                }
            });

            if (fueIluminada) {
                console.log(` Estación encontrada e iluminada: ${nombreEstacion}`);
                reproducirMarimba();
            } else {
                console.warn(` No se encontró la estación (revisa el nombre exacto): ${nombreEstacion}`);
            }
        });
    </script>

</body>
</html>
